name: CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run lint
        working-directory: app
        run: npm run lint

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Write commit SHA
        working-directory: app
        run: echo "${GITHUB_SHA}" > VERSION

      - name: Create release package
        run: |
          mkdir -p artifact

          tar \
            --exclude='app/node_modules' \
            --exclude='app/tests' \
            --exclude='app/test' \
            --exclude='app/*.test.js' \
            --exclude='app/*.spec.js' \
            -czf "artifact/webapp-${GITHUB_SHA}.tar.gz" \
            app \
            deploy \
            scripts

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-${{ github.sha }}
          path: artifact/webapp-${{ github.sha }}.tar.gz

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: production
      url: http://${{ vars.BASTION_HOST }}

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-${{ github.sha }}
          path: artifact

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$SSH_PRIVATE_KEY" > deploy-key.pem
          chmod 600 deploy-key.pem

      - name: Copy release to app server
        env:
          BASTION_HOST: ${{ vars.BASTION_HOST }}
          APP_HOST: ${{ vars.APP_HOSTS }}
          SSH_USER: ${{ vars.SSH_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          scp \
            -i deploy-key.pem \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="ssh -i deploy-key.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p ${SSH_USER}@${BASTION_HOST}" \
            "artifact/webapp-${RELEASE_SHA}.tar.gz" \
            "${SSH_USER}@${APP_HOST}:/tmp/webapp-${RELEASE_SHA}.tar.gz"

      - name: Run deployment
        env:
          BASTION_HOST: ${{ vars.BASTION_HOST }}
          APP_HOST: ${{ vars.APP_HOSTS }}
          SSH_USER: ${{ vars.SSH_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i deploy-key.pem \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="ssh -i deploy-key.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p ${SSH_USER}@${BASTION_HOST}" \
            "${SSH_USER}@${APP_HOST}" \
            "sudo mkdir -p /tmp/webapp-deploy && \
             sudo tar -xzf /tmp/webapp-${RELEASE_SHA}.tar.gz -C /tmp/webapp-deploy && \
             sudo chmod +x /tmp/webapp-deploy/scripts/deploy.sh && \
             sudo /tmp/webapp-deploy/scripts/deploy.sh ${RELEASE_SHA}"

      - name: Health check
        env:
          BASTION_HOST: ${{ vars.BASTION_HOST }}
          APP_HOST: ${{ vars.APP_HOSTS }}
          SSH_USER: ${{ vars.SSH_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i deploy-key.pem \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="ssh -i deploy-key.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p ${SSH_USER}@${BASTION_HOST}" \
            "${SSH_USER}@${APP_HOST}" \
            "curl -fsS http://localhost:3000/health"

      - name: Smoke test
        env:
          BASTION_HOST: ${{ vars.BASTION_HOST }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          for _ in {1..10}; do
            VERSION=$(curl -fsS "http://${BASTION_HOST}/version" || true)

            if [ "$VERSION" = "$RELEASE_SHA" ]; then
              echo "Smoke test passed."
              exit 0
            fi

            sleep 3
          done

          echo "Smoke test failed."
          echo "Expected: $RELEASE_SHA"
          echo "Received: $VERSION"
          exit 1